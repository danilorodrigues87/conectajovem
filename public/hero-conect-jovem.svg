<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="900" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070b14"/>
      <stop offset="0.45" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0d2847"/>
    </linearGradient>
    <linearGradient id="glow" x1="400" y1="200" x2="1200" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00c2a8" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#00c2a8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00c2a8"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="1100" cy="180" rx="420" ry="280" fill="url(#glow)" filter="url(#blur)"/>
  <ellipse cx="300" cy="650" rx="360" ry="240" fill="#00c2a8" opacity="0.08" filter="url(#blur)"/>
  <ellipse cx="800" cy="450" rx="500" ry="300" fill="#3b82f6" opacity="0.06" filter="url(#blur)"/>
  <!-- abstract people / connection nodes -->
  <circle cx="520" cy="380" r="72" fill="#00c2a8" opacity="0.12"/>
  <circle cx="520" cy="380" r="48" stroke="url(#line)" stroke-width="3" opacity="0.5"/>
  <circle cx="1080" cy="320" r="88" fill="#3b82f6" opacity="0.1"/>
  <circle cx="1080" cy="320" r="56" stroke="url(#line)" stroke-width="3" opacity="0.45"/>
  <circle cx="780" cy="520" r="64" fill="#00c2a8" opacity="0.08"/>
  <circle cx="780" cy="520" r="40" stroke="url(#line)" stroke-width="2.5" opacity="0.4"/>
  <path d="M568 380 H732" stroke="url(#line)" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  <path d="M868 350 Q920 420 980 520" stroke="url(#line)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M600 420 Q700 480 760 520" stroke="url(#line)" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <!-- subtle grid -->
  <g opacity="0.04" stroke="#fff" stroke-width="1">
    <line x1="0" y1="150" x2="1600" y2="150"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
  </g>
</svg>
